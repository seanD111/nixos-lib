name: Flake CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Run flake checks
        run: nix flake check --print-build-logs

  nixos-tests:
    name: nixos vm tests
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Build workstation VM test
        run: nix build .#hydraJobs.x86_64-linux.workstation -o result-workstation

      - name: Build sway VM test
        run: nix build .#hydraJobs.x86_64-linux.workstation-sway -o result-sway

      - name: Build niri VM test
        run: nix build .#hydraJobs.x86_64-linux.workstation-niri -o result-niri

      - name: Upload sway test screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sway-test-screenshots
          path: result-sway/*.png
          if-no-files-found: warn

      - name: Upload niri test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: niri-test-artifacts
          path: |
            result-niri/*.png
            result-niri/niri-screenshot/*.png
            result-niri/cheatsheet/*.png
            result-niri/config/*.kdl
          if-no-files-found: warn

      - name: Upload workstation test screenshots
        uses: actions/upload-artifact@v4
        with:
          name: workstation-test-screenshots
          path: result-workstation/*.png
          if-no-files-found: warn
